name: Cloudflare native foundation

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply the isolated D1 migration before deployment
        required: true
        default: false
        type: boolean
  push:
    branches:
      - feat/cloudflare-native
    paths:
      - 'apps/web/**'
      - 'infra/cloudflare-native/**'
      - 'wrangler.cloudflare-native.jsonc'
      - '.github/workflows/cloudflare-native.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-foundation:
    runs-on: ubuntu-latest
    environment: cloudflare-native
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oremedia/web build

      - name: Apply isolated D1 migration
        if: ${{ inputs.apply_migrations == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm dlx wrangler@4.147.0 d1 migrations apply oremedia-cf-native-db --remote --config wrangler.cloudflare-native.jsonc

      - name: Deploy foundation Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm dlx wrangler@4.147.0 deploy --config wrangler.cloudflare-native.jsonc --var OREMEDIA_CF_COMMIT:${{ github.sha }}
